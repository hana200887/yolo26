[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "traffic-analytics"
version = "0.1.0"
description = "Educational real-time traffic analytics with YOLO26 and ByteTrack."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "huyho" }]
dependencies = [
  "lap>=0.5.12,<0.6",
  "numpy>=2,<3",
  "opencv-python>=4.10,<5",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "ultralytics==8.4.118",
]

[project.scripts]
traffic-analytics = "traffic_analytics.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "pytest-socket>=0.7,<1",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_analytics"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --disable-socket --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = [
  "model: requires real model weights and may require network access",
]

[tool.coverage.run]
branch = true
source = ["traffic_analytics"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["traffic_analytics"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "ultralytics", "ultralytics.*"]
ignore_missing_imports = true
